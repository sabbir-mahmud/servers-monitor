{% load monitor %}{% if a.on_push %}<span class="chip">{% icon "git-branch" 12 %} on push to {{ a.branch }}</span>{% endif %}{% if a.cron %}<span class="chip" title="{{ a.cron }}">{% icon "clock" 12 %} {{ a.cron|cron_label }}</span>{% endif %}{% if not a.on_push and not a.cron %}<span class="chip">{% icon "play" 12 %} by hand</span>{% endif %}{% if a.require_approval %}<span class="chip chip-warning">needs approval</span>{% endif %}
