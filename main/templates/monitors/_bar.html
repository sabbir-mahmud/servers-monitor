<div class="ubar{% if tall %} ubar-tall{% endif %}" role="img" aria-label="Uptime over the last 24 hours">{% for b in bar %}<i class="ubar-{{ b.state }}" title="{{ b.start|date:'M j, H:i' }}–{{ b.end|date:'H:i' }}: {% if b.state == 'none' %}no checks{% else %}{{ b.pct }}% up ({{ b.up }} ok, {{ b.down }} failed){% endif %}"></i>{% endfor %}</div>
