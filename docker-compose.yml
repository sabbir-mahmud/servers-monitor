# Server Monitor on any machine with Docker: a laptop, a home server, a Raspberry Pi.
# Nothing here is reachable from the internet: the UI binds to this machine only, and both
# containers dial OUT to your Redis relay. Agents never connect to this machine.
#
#   cp main/.env.example main/.env     # set SECRET_KEY and REDIS_URL
#   docker compose up -d --build
#   docker compose exec web python manage.py createsuperuser
#   open http://127.0.0.1:8000
x-app: &app
  build: { context: ., dockerfile: main/Dockerfile }
  env_file: main/.env
  volumes: [data:/data]
  restart: unless-stopped

services:
  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 30 --access-logfile -"
    # Change to "8000:8000" to open it to your LAN (and add the IP to ALLOWED_HOSTS).
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 256m
    healthcheck:  # healthy = migrations applied and the app answering
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=3)"]
      interval: 10s
      start_period: 20s

  relay:
    <<: *app
    # Exactly one: receives heartbeats/results, retries queued jobs, offline sweep, pruning.
    command: python manage.py relay
    depends_on: { web: { condition: service_healthy } }  # web runs the migrations
    mem_limit: 128m

volumes:
  data:
