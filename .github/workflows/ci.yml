name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard (lint, tests, checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: main/requirements*.txt
      - run: make install
      - run: make lint
      - run: make test
      - run: make check

  agent:
    name: Agent on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Servers run the agent on their system Python: Debian 12 = 3.11, Ubuntu 24.04 = 3.12.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r agent/requirements.txt pytest
      - run: python -m py_compile agent/server_monitor_agent.py agent/smctl.py
      - run: python -m pytest agent/tests -q

  device-agent:
    name: Device agent on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: device-agent
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: device-agent/go.mod
          cache-dependency-path: device-agent/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: ./build.sh
        if: matrix.os == 'ubuntu-latest'

  installer:
    name: Installer (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck agent/install.sh
