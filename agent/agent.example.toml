# /etc/server-monitor-agent/agent.toml  (mode 640, owner root:server-monitor)
#
# This file is the allowlist. The dashboard can only offer (and this agent will only
# run) the services, logs and actions declared here. Manage it with `sudo smctl`, which
# validates and restarts for you.

[main]
# The connection string from the dashboard's "Add server" page. sm-<id> is this server's own
# Redis user: it can only reach this server's two relay keys. Rotate in the dashboard, then
#   sudo smctl connect 'rediss://...'
redis_url = "rediss://sm-<server-id>:<password>@<relay-host>:6379"
verify_tls = true
# ca_file = "/etc/ssl/certs/internal-ca.pem"   # for a private CA
# allow_insecure = true                        # redis:// without TLS: local development ONLY

[agent]
# Starting value; the dashboard pushes changes live (edit the server there).
# Each heartbeat costs ~2 relay commands: 120 s ~= 65K Redis commands per server per month.
report_interval = 120
max_concurrent_commands = 2
# Mounts to watch. Empty = every real (non-tmpfs/overlay) filesystem.
disk_mounts = []
# systemd restarts run as `sudo -n systemctl restart <unit>` when the agent isn't root.
use_sudo_for_restart = true
# Top processes, temperatures, GPUs and containers (cgroup files, no docker access) in each
# heartbeat. Read-only; a few KB.
inventory = true
# Let dashboard Admins upgrade this agent (release tags only, checksum-verified, done by a
# root systemd unit that re-checks every request). `sudo smctl remote-upgrade on`.
remote_upgrade = false

# ---------------------------------------------------------------- services
# kind: systemd | docker | pm2 | process | http
# unit: systemd unit / container name / pm2 app name / process-name substring / URL (http)
# restartable: show a Restart button and allow the built-in restart_service action.

[services.nginx]
kind = "systemd"
unit = "nginx"
restartable = true
version_command = ["nginx", "-v"]

[services.api]
kind = "systemd"
unit = "gunicorn-api"
restartable = true
version_file = "/var/www/api/VERSION"

# [services.worker]
# kind = "docker"
# unit = "api-worker-1"
# restartable = true
#
# [services.frontend]
# kind = "pm2"
# unit = "frontend"
# restartable = true
#
# [services.api-health]
# kind = "http"
# url = "http://127.0.0.1:8000/health/"

# ---------------------------------------------------------------- logs
# name = path. Only these files can be tailed from the dashboard. The agent user must be
# able to read them (the installer adds it to the `adm` group for /var/log).

[logs]
nginx_error = "/var/log/nginx/error.log"
syslog = "/var/log/syslog"
# api = "/var/www/api/logs/app.log"

# ---------------------------------------------------------------- actions
# Named, argument-free commands — your deploy/update scripts. argv lists, no shell, so
# nothing the dashboard sends can be spliced into them. Put real logic in a script.

[actions.deploy_api]
description = "git pull, install deps, migrate, restart"
command = ["/opt/deploy/deploy_api.sh"]
cwd = "/var/www/api"
timeout = 900
env = { DJANGO_SETTINGS_MODULE = "config.settings" }

[actions.disk_report]
description = "Show filesystem usage"
command = ["df", "-h"]
timeout = 30

# [actions.apt_upgrade]
# description = "Install security updates"
# command = ["sudo", "-n", "/usr/bin/unattended-upgrade", "-v"]
# timeout = 1800

# ---------------------------------------------------------------- probes
# Let the dashboard run HTTP/TCP uptime checks from this server (internal URLs included;
# cloud metadata never). Results ride on heartbeats. `sudo smctl probes on`.
# [probes]
# enabled = true

# ---------------------------------------------------------------- docker
# Container names and stopped containers via `docker ps`. Needs the docker group, which is
# root-equivalent: `sudo smctl docker enable` sets both.
# [docker]
# names = true

# ---------------------------------------------------------------- shell
# Free-form commands from the dashboard (Admin role only, every one audited). Off by
# default: with it on, anyone who controls main controls this server as the agent user.
[shell]
enabled = false
timeout = 120
